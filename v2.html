<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.back{pointer-events:auto;font:600 11px/1 Montserrat;color:#9aa1ad;text-decoration:none;letter-spacing:.4px}

.ladder{position:absolute;right:14px;top:96px;display:flex;flex-direction:column;align-items:flex-end;gap:16px}

.toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-10px);opacity:0;transition:.3s;background:rgba(17,17,20,.95);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:10px 16px;font:600 12.5px Montserrat;white-space:nowrap}

  return S_[name] || base[name] || null }
function furShells(o){
  const T = cubeTex(), N = 18, L = .011;
  for(let i = 0; i < N; i++){ const f = (i + 1) / N;
    const m = M_({map: T.zebra, color: new THREE.Color().setScalar(.5 + .55 * f), roughness: .92, alphaMap: T.noise, alphaTest: .15 + .8 * f, envMapIntensity: .5});

    const sh = new THREE.Mesh(o.geometry, m); sh.userData.fur = true; o.add(sh) } }
function noLatch(root){   // drop the two front latch clasps (base + lid halves) baked into the case shells (Sharon, 2026-11-18)
  root.traverse(o => { if(!o.isMesh || !/^Bolt/.test(o.material.name) || !o.geometry.index || o.geometry.userData.noLatch) return; const g2 = o.geometry, P = g2.attributes.position, I = g2.index.array, keep = [];
    for(let i = 0; i < I.length; i += 3){ let x = 0, y = 0, z = 0; for(let q = 0; q < 3; q++){ x += P.getX(I[i+q]); y += P.getY(I[i+q]); z += P.getZ(I[i+q]) } x /= 3; y /= 3; z /= 3;
      if(Math.abs(x) > .17 && Math.abs(x) < .30 && y > .64 && z > .37) continue; keep.push(I[i], I[i+1], I[i+2]) }
    window.__noLatch = (window.__noLatch || 0) + (I.length - keep.length) / 3; g2.setIndex(keep); g2.userData.noLatch = true }); return root }
function loadCube(skin){

  return (cubeSrc[url] = cubeSrc[url] || loader.loadAsync(url).then(g => { noLatch(g.scene); return g })).then(g => {
    const root = g.scene.clone(true), furry = [];
    root.traverse(o => { if(!o.isMesh) return; const nm = o.material.name; if(skin === 'zebrafur' && nm === 'CarbonPanel') furry.push(o);
      const m = cubeMat(skin, nm, o.material); if(m && o.material.normalMap && !m.normalMap && /Rail|AluPanel/.test(nm)){ m.normalMap = o.material.normalMap; m.normalScale = o.material.normalScale.clone() }   // keep the model's bevel detail
      if(!m && /^PrismEnamel/.test(nm)){ ROOM = ROOM || studioEnv(); const em = o.material; em.envMap = ROOM; em.envMapIntensity = .55; if('clearcoat' in em){ em.clearcoat = 1; em.clearcoatRoughness = .04 } em.roughness = .22; em.metalness = 0 }   // baked glossy enamel + clear coat
      if(m){ ROOM = ROOM || studioEnv(); m.envMap = ROOM; if(m.metalness >= .9) m.envMapIntensity = 1.1; o.material = m } });   // chrome needs bright reflections in the app's dark studio
    furry.forEach(furShells);
    root.scale.setScalar(CUBE_SCALE);
    const box = new THREE.Box3().setFromObject(root); root.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
    const holder = new THREE.Group(); holder.add(root); holder.userData.cube = skin; return holder }) }


// ---- the corridor: floating boxes, a spotlight each, dust for parallax; the swoosh layer sits behind the transparent canvas ----
const zOf=i=>-i*D;
const radial=(stops)=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),gr=g.createRadialGradient(128,128,0,128,128,128);stops.forEach(([o,col])=>gr.addColorStop(o,col));g.fillStyle=gr;g.fillRect(0,0,256,256);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t};
const holders=[];
BOXES.forEach((b,i)=>{const z=zOf(i);
 const sp=new THREE.SpotLight(0xd9d4ff,30,14,.42,.8,1.4);sp.position.set(0,5.2,z+1.6);sp.target.position.set(0,.8,z);S.add(sp,sp.target);
 const h=new THREE.Group();h.position.set(0,.14,z);h.rotation.y=-.5;S.add(h);holders.push(h)});
// dust motes for parallax
{const N=700,p=new Float32Array(N*3);for(let k=0;k<N;k++){p[3*k]=(Math.random()-.5)*12;p[3*k+1]=Math.random()*6;p[3*k+2]=6-Math.random()*(D*BOXES.length+10)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 S.add(new THREE.Points(g,new THREE.PointsMaterial({size:.035,color:0xcfe0ff,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending,map:radial([[0,'rgba(255,255,255,1)'],[1,'rgba(255,255,255,0)']])})))}

// ---- load the boxes (nearest first) ----
let loaded=0;
BOXES.forEach((b,i)=>setTimeout(()=>loadCube(b.skin).then(m=>{const bb=new THREE.Box3().setFromObject(m),sz=bb.getSize(new THREE.Vector3()),k=1.45/Math.max(sz.x,sz.y,sz.z);m.scale.multiplyScalar(k);holders[i].add(m);if(++loaded===1)$('#load').classList.add('off')}).catch(e=>{console.warn(e);if(++loaded===1)$('#load').classList.add('off')}),i*120));
setTimeout(()=>$('#load').classList.add('off'),8000);

// ---- camera: rest pose per box; a lifted bezier flight between them ----
const rest=i=>({p:new THREE.Vector3(0,.7+DIST*.16,zOf(i)+DIST),l:new THREE.Vector3(0,.32,zOf(i))});
let cur=0,fly=null,bobY=0,bobV=0;
size();const P=rest(0);cam.position.copy(P.p);const look=P.l.clone();cam.lookAt(look);
const bez=(a,b,c,d,t)=>{const u=1-t;return a.clone().multiplyScalar(u*u*u).add(b.clone().multiplyScalar(3*u*u*t)).add(c.clone().multiplyScalar(3*u*t*t)).add(d.clone().multiplyScalar(t*t*t))};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function goTo(j){j=Math.max(0,Math.min(BOXES.length-1,j));if(j===cur&&!fly)return;
 const from=fly?{p:cam.position.clone(),l:look.clone()}:rest(cur),to=rest(j),n=Math.abs(j-(fly?fly.j:cur))||1,dir=j>cur?1:-1;
 const lift=2.8+.6*(n-1);
 const p1=new THREE.Vector3(0,from.p.y+lift,from.p.z+(to.p.z-from.p.z)*.22),p2=new THREE.Vector3(0,to.p.y+lift*.9,from.p.z+(to.p.z-from.p.z)*.8);
 fly={j,dir,t0:performance.now(),dur:RM?1:(1700+420*(n-1)),from,to,p1,p2};
 cur=j;paint(dir);whoosh(n)}
function frame(now){requestAnimationFrame(frame);
 if(fly){let t=Math.min(1,(now-fly.t0)/fly.dur);if(RM)t=1;const u=ease(t);
  cam.position.copy(bez(fly.from.p,fly.p1,fly.p2,fly.to.p,u));
  look.lerpVectors(fly.from.l,fly.to.l,ease(Math.min(1,t*1.15)));look.y-=Math.sin(Math.PI*u)*.35;   // dip the gaze while airborne: you look down onto the next box
  cam.fov=FOV+6*Math.sin(Math.PI*u);cam.updateProjectionMatrix();
  if(t>=1){fly=null;bobV=-1.1;arrive()}}
 // landing settle: a damped spring on height
 const dt=1/60;bobV+=(-70*bobY-10*bobV)*dt;bobY+=bobV*dt;
 if(!fly){const r=rest(cur);cam.position.set(r.p.x,r.p.y+bobY*.18,r.p.z)}
 cam.lookAt(look);
 { const r0=rest(0),depth=(r0.p.z-cam.position.z)/D,rise=cam.position.y-r0.p.y;
   bgfx.style.transform=`translate3d(0,${(rise*26).toFixed(1)}px,0) scale(${(1+depth*.07+rise*.025).toFixed(4)})`; }
 if(!fly){ const v=new THREE.Vector3(0,.86,zOf(cur)).project(cam); app.style.setProperty('--by',((1-v.y)/2*100).toFixed(2)+'%') }
 const tt=now/1000;holders.forEach((h,i)=>{const on=i===cur&&!fly;h.rotation.y+=((on?-.35+Math.sin(tt*.5)*.35:-.5)-h.rotation.y)*.04;h.position.y=.14+(i===cur?.04*Math.sin(tt*1.4):0)});
  R.render(S,cam)}
function arrive(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}thump()}
function size(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
 DIST=Math.max(6.5,1.75/(Math.tan(FOV*Math.PI/360)*Math.min(1,cam.aspect)))}   // keep about 2.3 box-widths across, also in portrait
addEventListener('resize',size);requestAnimationFrame(frame);

// ---- UI ----
const lad=$('#ladder');lad.innerHTML=BOXES.map((b,i)=>`<button type="button" data-i="${i}" aria-label="${b.n}"><span>${b.n.toUpperCase()}</span><i></i></button>`).join('');
lad.onclick=e=>{const b=e.target.closest('[data-i]');if(b)goTo(+b.dataset.i)};
function paint(dir,first){const b=BOXES[cur],nm=$('#nm');nm.style.setProperty('--d',dir);
 if(first)nm.textContent=b.n;else{nm.classList.remove('in');nm.classList.add('out');setTimeout(()=>{nm.textContent=b.n;nm.classList.remove('out');void nm.offsetWidth;nm.classList.add('in')},RM?0:420)}
 $('#idx').textContent=`BOX ${cur+1} / ${BOXES.length}`;$('#mn').textContent=money(b.min);$('#mx').textContent=money(b.max);$('#buy').textContent='OPEN FOR '+money(b.price);
 $('#prev').disabled=cur===0;$('#next').disabled=cur===BOXES.length-1;lad.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===cur))}
paint(1,true);
$('#next').onclick=()=>goTo(cur+1);$('#prev').onclick=()=>goTo(cur-1);
let tt;$('#buy').onclick=()=>{const t=$('#toast');t.textContent='V2 demo: box navigation only';t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)};
addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','PageDown'].includes(e.key)){e.preventDefault();goTo(cur+1)}if(['ArrowDown','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goTo(cur-1)}});
let wheelAt=0;cv.addEventListener('wheel',e=>{e.preventDefault();const n=performance.now();if(n-wheelAt<900||Math.abs(e.deltaY)<8)return;wheelAt=n;goTo(cur+(e.deltaY>0?1:-1))},{passive:false});
let sx=0,sy=0,st=0;
app.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;sx=e.clientX;sy=e.clientY;st=performance.now()});
app.addEventListener('pointerup',e=>{if(!st)return;const dx=e.clientX-sx,dy=e.clientY-sy;st=0;if(Math.max(Math.abs(dx),Math.abs(dy))<36)return;
 if(Math.abs(dy)>=Math.abs(dx))goTo(cur+(dy<0?1:-1));else goTo(cur+(dx<0?1:-1))});

// ---- sound: an airy whoosh for the flight, a soft thump on landing (starts after the first tap) ----
let AC=null;const ac=()=>{try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC};
addEventListener('pointerdown',ac,{once:true,capture:true});addEventListener('keydown',ac,{once:true,capture:true});
function noise(d){const a=AC,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;return s}

 f.type='bandpass';f.Q.value=1.4;f.frequency.setValueAtTime(260,t);f.frequency.exponentialRampToValueAtTime(1900,t+d*.5);f.frequency.exponentialRampToValueAtTime(380,t+d);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+d*.45);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d)}

 g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.36)}
window.__v2={goTo,get cur(){return cur},get flying(){return !!fly}};
