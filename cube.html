<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MistyBox Cube 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111114;--fg:#f2f2f4;--mut:rgba(255,255,255,.55);--acc:#d9dce2}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Poppins,system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.ui{position:fixed;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:10px;padding:0 16px}
button{height:44px;padding:0 22px;border:0;font:600 13px Poppins,sans-serif;letter-spacing:1.6px;color:#141416;cursor:pointer;
 background:linear-gradient(180deg,#f4f5f7,#c9ccd2);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
button.ghost{background:rgba(255,255,255,.1);color:var(--fg)}
.ttl{position:fixed;top:20px;left:0;right:0;text-align:center;pointer-events:none}
.ttl b{display:block;font-size:11px;letter-spacing:4px;color:var(--mut);font-weight:600}
.ttl span{font-size:20px;font-weight:600}
.skins{position:fixed;top:104px;left:0;right:0;display:flex;justify-content:center;gap:8px}.skins button{height:34px;padding:0 14px;font-size:11px}.skins button.on{background:linear-gradient(180deg,#f4f5f7,#c9ccd2);color:#141416}
.hint{position:fixed;top:78px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<div class="ttl"><b>MISTYBOX · NEW BOX</b><span>The Cube</span></div>
<div class="hint">Drag to rotate · pinch / scroll to zoom</div>
<div class="skins"><button class="ghost on" data-skin="alu">ALUMINIUM</button><button class="ghost" data-skin="carbon">BLACK CARBON</button><button class="ghost" data-skin="zebra">ZEBRA</button></div>
<div class="ui"><button id="lid">OPEN LID</button><button class="ghost" id="spin">AUTO-ROTATE</button></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const R = new THREE.WebGLRenderer({antialias: true});
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; R.outputColorSpace = THREE.SRGBColorSpace;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x111114);
S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), .04).texture; S.environmentIntensity = .9;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-2.5, 4, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = key.shadow.camera.bottom = -1.5; key.shadow.camera.right = key.shadow.camera.top = 1.5; key.shadow.radius = 6; S.add(key);
const rim = new THREE.DirectionalLight(0xcfd8ff, 1.2); rim.position.set(2.5, 2, -3); S.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({opacity: .45})); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; S.add(floor);

const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .3, 20);
const ctl = new OrbitControls(cam, R.domElement); ctl.target.set(0, .48, 0); ctl.enableDamping = true; ctl.minDistance = 1.6; ctl.maxDistance = 7;
ctl.maxPolarAngle = Math.PI * .52;
function frame(){ const d = innerWidth < innerHeight ? 5.2 : 3.9; cam.position.set(-Math.sin(.62) * d, .48 + d * .42, Math.cos(.62) * d); cam.lookAt(ctl.target) }
frame();

// brushed-aluminium look (the Blender noise roughness doesn't travel in glTF, so tune it here)
const brush = (() => { const c = document.createElement('canvas'); c.width = 512; c.height = 64; const g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 512, 64);
  for(let i = 0; i < 1400; i++){ const y = Math.random() * 64, v = 100 + Math.random() * 70 | 0; g.fillStyle = `rgba(${v},${v},${v},.35)`; g.fillRect(0, y, 512, Math.random() * 1.2 + .3) }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 10); return t })();
const LOOK = {
  AluPanel: {color: 0xb4b7bd, metalness: 1, roughness: .42}, AluRail: {color: 0xd9dce1, metalness: 1, roughness: .26},
  AluBlock: {color: 0xd4d7dc, metalness: 1, roughness: .3}, BoltSteel: {color: 0x9a9da3, metalness: 1, roughness: .18},
  InteriorBlack: {color: 0x0b0b0d, metalness: 0, roughness: .95}, HingeSteel: {color: 0xa8abb1, metalness: 1, roughness: .22},
  BlackRail: {color: 0x1a1a1d, metalness: 1, roughness: .3}, BlackBlock: {color: 0x1c1c20, metalness: 1, roughness: .32},
  BoltChrome: {color: 0xe8e9ec, metalness: 1, roughness: .08}, HingeDark: {color: 0x45464a, metalness: 1, roughness: .25}};
// 2x2 twill carbon weave (matches the Blender shader: 64 tows per metre on the panel UVs)
const carbonTex = (() => { const n = 8, px = 32, c = document.createElement('canvas'); c.width = c.height = n * px; const g = c.getContext('2d');
  for(let i = 0; i < n; i++) for(let j = 0; j < n; j++){ const horiz = ((i + j) % 4) < 2, x = i * px, y = j * px;
    const gr = horiz ? g.createLinearGradient(0, y, 0, y + px) : g.createLinearGradient(x, 0, x + px, 0);
    const hi = horiz ? 44 : 22; gr.addColorStop(0, '#060607'); gr.addColorStop(.5, `rgb(${hi},${hi},${hi + 3})`); gr.addColorStop(1, '#060607');
    g.fillStyle = gr; g.fillRect(x, y, px, px) }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t })();
const zebraTex = new THREE.TextureLoader().load('assets/3d/zebra_fur.jpg', t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8 });
zebraTex.wrapS = zebraTex.wrapT = THREE.RepeatWrapping; zebraTex.repeat.set(1.45, 1.45); zebraTex.center.set(.5, .5); zebraTex.rotation = -.55;   // glTF flips V: turn the stripes back to diagonal
const ZEBRA = {CarbonPanel: () => new THREE.MeshStandardMaterial({map: zebraTex, roughness: .95, metalness: 0, envMapIntensity: .55}),
  BlackRail: () => new THREE.MeshStandardMaterial({color: 0xe6e8ec, metalness: 1, roughness: .18, roughnessMap: brush}),
  BlackBlock: () => new THREE.MeshStandardMaterial({color: 0xe2e4e8, metalness: 1, roughness: .2}),
  HingeDark: () => new THREE.MeshStandardMaterial({color: 0xd8dadf, metalness: 1, roughness: .14})};
let curSkin = 'alu';
function makeMat(name){ if(curSkin === 'zebra' && ZEBRA[name]) return ZEBRA[name](); if(name === 'CarbonPanel') return new THREE.MeshPhysicalMaterial({map: carbonTex, metalness: .1, roughness: .4, clearcoat: .8, clearcoatRoughness: .12});
  const L = LOOK[name]; return L ? new THREE.MeshStandardMaterial({...L, roughnessMap: /Alu/.test(name) ? brush : null}) : null }

let hinge = null, model = null, lidAngle = 0;
const cache = {};
const gltfs = {};
function loadSkin(skin){
  curSkin = skin;
  const url = skin === 'alu' ? 'assets/3d/cube.glb' : 'assets/3d/cube_carbon.glb';   // zebra shares the carbon model (same UVs), new materials
  (gltfs[url] = gltfs[url] || new Promise(res => new GLTFLoader().load(url, g => res(g.scene)))).then(src => {
    if(curSkin !== skin) return;
    const root = src.clone(true);
    root.traverse(o => { if(!o.isMesh) return; o.castShadow = true; o.receiveShadow = true; const m = makeMat(o.material.name); if(m) o.material = m });
    const ang = hinge ? hinge.rotation.x : 0;
    if(model) S.remove(model); model = root; hinge = root.getObjectByName('LidHinge'); if(hinge) hinge.rotation.x = ang; S.add(root) });
  document.querySelectorAll('.skins button').forEach(b => b.classList.toggle('on', b.dataset.skin === skin));
  S.environmentIntensity = skin === 'carbon' ? .45 : .9;
}
document.querySelectorAll('.skins button').forEach(b => b.onclick = () => loadSkin(b.dataset.skin));
loadSkin(new URLSearchParams(location.search).get('skin') || 'alu');

let lidT = 0, lidGoal = 0, spin = false;
const btn = document.getElementById('lid');
btn.onclick = () => { lidGoal = lidGoal ? 0 : 1; btn.textContent = lidGoal ? 'CLOSE LID' : 'OPEN LID' };
const sb = document.getElementById('spin'); sb.onclick = () => { spin = !spin; ctl.autoRotate = spin; ctl.autoRotateSpeed = 1.6; sb.textContent = spin ? 'STOP' : 'AUTO-ROTATE' };
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix() });
const clk = new THREE.Clock();
R.setAnimationLoop(() => {
  const dt = Math.min(clk.getDelta(), .05);
  lidT += (lidGoal - lidT) * Math.min(1, dt * 3.2);
  if(hinge){ const e = lidT; hinge.rotation.x = -THREE.MathUtils.degToRad(115 * e) }
  ctl.update(); R.render(S, cam);
});
</script>
</body></html>
